name: Publish GHCR images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-ghcr.yml"
      - "frontend/**"
      - "java-services/**"
      - "docker-compose.yml"
      - "docker-compose.rag.override.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  DOCKER_METADATA_SHORT_SHA_LENGTH: 8

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: student-management-ute-restful-api
            dockerfile: java-services/restful-api/Dockerfile
            description: CampusCore Spring Boot RESTful API
          - package: student-management-ute-rag-service
            dockerfile: java-services/restful-api/Dockerfile
            description: CampusCore dedicated thesis RAG service
          - package: student-management-ute-frontend
            dockerfile: frontend/Dockerfile
            description: CampusCore Next.js frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.package }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            JAVA_API_ORIGIN=http://restful-api:4010
            NEXT_PUBLIC_API_URL=/api/v1
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
