name: Publish container images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-ghcr.yml"
      - "frontend/**"
      - "java-services/**"
      - "database/**"
      - "docker-compose.yml"
      - "docker-compose.rag.override.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR normalizes owner names to lowercase; keep the published namespace
  # explicit so preflight, metadata, and promotion address the same package.
  IMAGE_OWNER: jasontm17
  DOCKERHUB_OWNER: nguyenson1710
  DOCKER_METADATA_SHORT_SHA_LENGTH: 8

jobs:
  publish:
    name: Publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: student-management-ute-database
            hub-package: campuscore-database
            dockerfile: database/Dockerfile
            description: CampusCore PostgreSQL runtime; schema managed by Flyway
          - package: student-management-ute-restful-api
            hub-package: campuscore-restful-api
            dockerfile: java-services/restful-api/Dockerfile
            description: CampusCore Spring Boot RESTful API
          - package: student-management-ute-rag-service
            hub-package: campuscore-rag-service
            dockerfile: java-services/restful-api/Dockerfile
            description: CampusCore dedicated thesis RAG service
          - package: student-management-ute-frontend
            hub-package: campuscore-frontend
            dockerfile: frontend/Dockerfile
            description: CampusCore Next.js frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check immutable tag state
        id: immutability
        shell: bash
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.package }}
          HUB_IMAGE: docker.io/${{ env.DOCKERHUB_OWNER }}/${{ matrix.hub-package }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"

          inspect_digest() {
            local ref="$1" output status digest
            set +e
            output="$(docker buildx imagetools inspect "$ref" 2>&1)"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              digest="$(printf '%s\n' "$output" | awk '$1 == "Digest:" { print $2; exit }')"
              [[ "$digest" == sha256:* ]] || {
                printf 'Remote manifest for %s has no usable digest\n' "$ref" >&2
                return 2
              }
              printf '%s\n' "$digest"
              return 0
            fi
            if grep -Eqi 'manifest unknown|name unknown|not found|no such manifest' <<<"$output"; then
              printf 'ABSENT\n'
              return 0
            fi
            printf '%s\n' "$output" >&2
            return 2
          }

          ghcr_digest="$(inspect_digest "$GHCR_IMAGE:$short_sha")"
          hub_digest="$(inspect_digest "$HUB_IMAGE:$short_sha")"
          if [[ "$ghcr_digest" == ABSENT && "$hub_digest" == ABSENT ]]; then
            echo 'should_push=true' >> "$GITHUB_OUTPUT"
          elif [[ "$ghcr_digest" == sha256:* && "$hub_digest" == "$ghcr_digest" ]]; then
            echo 'should_push=false' >> "$GITHUB_OUTPUT"
            echo "digest=$ghcr_digest" >> "$GITHUB_OUTPUT"
          else
            echo 'Short-SHA tag exists in only one registry or has mismatched digests; refusing overwrite.' >&2
            exit 1
          fi

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.package }}
            docker.io/${{ env.DOCKERHUB_OWNER }}/${{ matrix.hub-package }}
          tags: |
            type=sha,format=short,prefix=
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and push
        if: steps.immutability.outputs.should_push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            JAVA_API_ORIGIN=http://restful-api:4010
            NEXT_PUBLIC_API_URL=/api/v1
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: mode=max
          sbom: true

      - name: Verify immutable registry parity
        if: always() && steps.immutability.outcome == 'success'
        shell: bash
        env:
          GHCR_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.package }}
          HUB_IMAGE: docker.io/${{ env.DOCKERHUB_OWNER }}/${{ matrix.hub-package }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"

          manifest_digest() {
            docker buildx imagetools inspect "$1" \
              | awk '$1 == "Digest:" { print $2; exit }'
          }

          ghcr_digest="$(manifest_digest "$GHCR_IMAGE:$short_sha")"
          hub_digest="$(manifest_digest "$HUB_IMAGE:$short_sha")"
          [[ "$ghcr_digest" == sha256:* && "$hub_digest" == "$ghcr_digest" ]] || {
            echo 'Published short-SHA manifests are missing or differ across registries.' >&2
            exit 1
          }
          {
            echo "### ${{ matrix.package }}"
            echo "- short SHA: \`$short_sha\`"
            echo "- digest: \`$ghcr_digest\`"
            echo '- GHCR and Docker Hub manifests: parity verified'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-latest:
    name: Promote verified images to latest
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote verified short-SHA manifests
        shell: bash
        env:
          GHCR_OWNER: ${{ env.IMAGE_OWNER }}
          DOCKERHUB_OWNER: ${{ env.DOCKERHUB_OWNER }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          pairs=(
            'student-management-ute-database|campuscore-database'
            'student-management-ute-restful-api|campuscore-restful-api'
            'student-management-ute-rag-service|campuscore-rag-service'
            'student-management-ute-frontend|campuscore-frontend'
          )

          manifest_digest() {
            docker buildx imagetools inspect "$1" \
              | awk '$1 == "Digest:" { print $2; exit }'
          }

          for pair in "${pairs[@]}"; do
            package="${pair%%|*}"
            hub_package="${pair##*|}"
            ghcr_image="ghcr.io/${GHCR_OWNER}/${package}"
            hub_image="docker.io/${DOCKERHUB_OWNER}/${hub_package}"
            ghcr_digest="$(manifest_digest "$ghcr_image:$short_sha")"
            hub_digest="$(manifest_digest "$hub_image:$short_sha")"
            [[ "$ghcr_digest" == sha256:* && "$hub_digest" == "$ghcr_digest" ]] || {
              echo "Cannot promote $package: short-SHA parity is not proven." >&2
              exit 1
            }

            docker buildx imagetools create --tag "$ghcr_image:latest" "$ghcr_image@$ghcr_digest"
            docker buildx imagetools create --tag "$hub_image:latest" "$hub_image@$hub_digest"
            latest_ghcr="$(manifest_digest "$ghcr_image:latest")"
            latest_hub="$(manifest_digest "$hub_image:latest")"
            [[ "$latest_ghcr" == "$ghcr_digest" && "$latest_hub" == "$hub_digest" ]] || {
              echo "Latest promotion digest mismatch for $package." >&2
              exit 1
            }
            echo "- $package: $short_sha -> $ghcr_digest (GHCR + Docker Hub latest verified)" >> "$GITHUB_STEP_SUMMARY"
          done
