name: Course CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-api:
    name: Java API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-services/pom.xml

      - name: Verify Java RESTful API
        run: mvn -q -f java-services/pom.xml verify

  web-quality:
    name: Web quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend smoke tests
        run: npm test --prefix frontend

      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  mobile-quality:
    name: Mobile quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Run mobile smoke tests
        run: npm test --prefix mobile

      - name: Typecheck mobile
        run: npm run typecheck --prefix mobile

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render Compose config
        run: |
          docker compose config
          docker compose -f docker-compose.e2e.yml config

      - name: Start course stack
        run: docker compose up -d --build postgres restful-api

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4010/api/v1/health/liveness >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs --no-color postgres restful-api
          exit 1

      - name: Check OpenAPI
        run: curl -fsS http://127.0.0.1:4010/v3/api-docs >/dev/null

      - name: Tear down stack
        if: always()
        run: docker compose down -v
