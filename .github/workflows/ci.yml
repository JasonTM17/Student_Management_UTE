name: Course API and Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-api:
    name: Java REST API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-services/pom.xml
      - name: Verify Java API
        run: mvn -q -f java-services/pom.xml verify

  frontend:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Test web
        working-directory: frontend
        run: npm test
      - name: Typecheck web
        working-directory: frontend
        run: npm run typecheck
      - name: Lint web
        working-directory: frontend
        run: npm run lint
      - name: Build web
        working-directory: frontend
        run: npm run build

  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test mobile
        working-directory: mobile
        run: npm test
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

  compose:
    name: Minimal Compose contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
