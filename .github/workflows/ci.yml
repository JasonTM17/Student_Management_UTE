name: Course API and Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-api:
    name: Java REST API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-services/pom.xml
      - name: Verify Java API
        run: mvn -q -f java-services/pom.xml verify

  frontend:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Test web
        working-directory: frontend
        run: npm test
      - name: Typecheck web
        working-directory: frontend
        run: npm run typecheck
      - name: Lint web
        working-directory: frontend
        run: npm run lint
      - name: Build web
        working-directory: frontend
        run: npm run build

  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test mobile
        working-directory: mobile
        run: npm test
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

  compose:
    name: PostgreSQL and Compose runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config
      - name: Build and start fresh course stack
        run: docker compose up -d --build --wait
      - name: Verify Flyway, health, OpenAPI, login and RAG
        shell: bash
        run: |
          version="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc 'SELECT version FROM thesis.flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1')"
          test "$version" = "9"
          curl --fail --silent --show-error http://127.0.0.1:4010/api/v1/health/liveness
          curl --fail --silent --show-error -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness
          curl --fail --silent --show-error http://127.0.0.1:4010/v3/api-docs > openapi.json
          python3 -c 'import json; paths=json.load(open("openapi.json", encoding="utf-8"))["paths"]; required={"/api/v1/auth/login", "/api/v1/students", "/api/v1/lecturers", "/api/v1/sections", "/api/v1/enrollments", "/api/v1/sections/{sectionId}/grades", "/api/v1/announcements", "/api/v1/notifications", "/api/v1/thesis/assistant/chat", "/api/v1/health/readiness"}; assert len(paths) >= 86 and not required.difference(paths)'
          login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"student@campuscore.edu","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          token="$(LOGIN="$login" python3 -c 'import json, os; print(json.loads(os.environ["LOGIN"])["accessToken"])')"
          assistant="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi"}' http://127.0.0.1:4010/api/v1/thesis/assistant/chat)"
          ASSISTANT="$assistant" python3 -c 'import json, os; data=json.loads(os.environ["ASSISTANT"]); assert data["reasonCode"] == "ANSWERED" and data["degraded"] is False and len(data["citations"]) > 0'
          docker compose stop postgres
          outage="$(curl --max-time 8 --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi"}' http://127.0.0.1:4010/api/v1/thesis/assistant/chat)"
          OUTAGE="$outage" python3 -c 'import json, os; data=json.loads(os.environ["OUTAGE"]); assert data["reasonCode"] == "KNOWLEDGE_UNAVAILABLE" and data["degraded"] is True and data["citations"] == []'
          docker compose start postgres
          docker compose up -d --wait
          curl --fail --silent --show-error -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness
      - name: Show runtime logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop course stack
        if: always()
        run: docker compose down
