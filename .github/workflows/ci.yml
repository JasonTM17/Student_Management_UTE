name: Course API and Client CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-api:
    name: Java REST API
    runs-on: ubuntu-latest
    env:
      # Provider tests are stubbed/no-network; a runtime key is never required in CI.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-services/pom.xml
      - name: Install pypdf for PDF parser round-trip tests
        run: python -m pip install --quiet pypdf
      - name: Verify Java API
        run: mvn -q -f java-services/pom.xml verify

  postgres-it:
    name: PostgreSQL race and RLS integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Provider tests are stubbed/no-network; a runtime key is never required in CI.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
      # Throwaway credentials for the ephemeral service container below; they
      # never leave this job and are not repository secrets. The assistant
      # runtime role password must be >= 16 chars (provision script contract).
      # Each *PostgresIT family documents its own env contract; every family
      # gets a dedicated scratch database on the service container, because the
      # suites gate on distinct variables and several assert absolute state or
      # a fresh schema. Database names are part of the contract: the council
      # suite requires campuscore_council_race_*, the policy/certificate/
      # notification suites require policy_migration_test_*, and the report
      # surefire suite requires a name ending in _regression — all on loopback.
      CAMPUSCORE_E2E_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_e2e'
      CAMPUSCORE_E2E_POSTGRES_USER: 'postgres'
      CAMPUSCORE_E2E_POSTGRES_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_COUNCIL_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_council_race_ci'
      CAMPUSCORE_COUNCIL_POSTGRES_USER: 'postgres'
      CAMPUSCORE_COUNCIL_POSTGRES_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_SUPLIST_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_suplist'
      CAMPUSCORE_SUPLIST_POSTGRES_USER: 'postgres'
      CAMPUSCORE_SUPLIST_POSTGRES_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_E2E_POSTGRES_UPGRADE_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_upgrade'
      CAMPUSCORE_E2E_POSTGRES_UPGRADE_USER: 'postgres'
      CAMPUSCORE_E2E_POSTGRES_UPGRADE_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_REPORT_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_report_regression'
      CAMPUSCORE_REPORT_POSTGRES_USER: 'postgres'
      CAMPUSCORE_REPORT_POSTGRES_PASSWORD: 'ci-postgres-it-ephemeral-01'
      ASSISTANT_RLS_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_assistant_rls'
      ASSISTANT_RLS_PRIMARY_USER: 'postgres'
      ASSISTANT_RLS_PRIMARY_PASSWORD: 'ci-postgres-it-ephemeral-01'
      ASSISTANT_RLS_RUNTIME_PASSWORD: 'ci-assistant-rls-ephemeral-01'
      ASSISTANT_RLS_JWT_SECRET: 'ci-assistant-rls-jwt-secret-ephemeral-012'
      ASSISTANT_RLS_JWT_REFRESH_SECRET: 'ci-assistant-rls-refresh-secret-ephemeral'
      ASSISTANT_MIGRATION_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_assistant_migration'
      ASSISTANT_MIGRATION_POSTGRES_USER: 'postgres'
      ASSISTANT_MIGRATION_POSTGRES_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_NOTIFICATION_AUDIT_ENABLED: 'true'
      CAMPUSCORE_NOTIFICATION_AUDIT_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_notification_audit'
      CAMPUSCORE_NOTIFICATION_AUDIT_USER: 'postgres'
      CAMPUSCORE_NOTIFICATION_AUDIT_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_POLICY_MIGRATION_ENABLED: 'true'
      CAMPUSCORE_POLICY_MIGRATION_LOCAL_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_policy_local'
      CAMPUSCORE_POLICY_MIGRATION_PREVIOUS_SUPABASE_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_policy_previous_supabase'
      CAMPUSCORE_POLICY_MIGRATION_CURRENT_SUPABASE_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_policy_current_supabase'
      CAMPUSCORE_POLICY_MIGRATION_HUMAN_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_policy_human'
      CAMPUSCORE_POLICY_MIGRATION_USER: 'postgres'
      CAMPUSCORE_POLICY_MIGRATION_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_CERTIFICATE_MIGRATION_ENABLED: 'true'
      CAMPUSCORE_CERTIFICATE_MIGRATION_CLEAN_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_clean'
      CAMPUSCORE_CERTIFICATE_MIGRATION_LOCAL_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_local'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_CONTENT_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_content'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_REVISION_CONTENT_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_revision_content'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_DOCUMENT_METADATA_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_document_metadata'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_REVISION_METADATA_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_revision_metadata'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_STATUS_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_status'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_DRAFT_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_draft'
      CAMPUSCORE_CERTIFICATE_MIGRATION_DRIFT_PUBLISHED_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_drift_published'
      CAMPUSCORE_CERTIFICATE_MIGRATION_CONCURRENT_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_concurrent'
      CAMPUSCORE_CERTIFICATE_MIGRATION_FOREIGN_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_foreign'
      CAMPUSCORE_CERTIFICATE_MIGRATION_NEWER_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_newer'
      CAMPUSCORE_CERTIFICATE_MIGRATION_BASE_DRIFT_URL: 'jdbc:postgresql://localhost:5432/policy_migration_test_cert_base_drift'
      CAMPUSCORE_CERTIFICATE_MIGRATION_USER: 'postgres'
      CAMPUSCORE_CERTIFICATE_MIGRATION_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_DEMO_TEAM_PG_ENABLED: 'true'
      CAMPUSCORE_DEMO_TEAM_PG_ADMIN_URL: 'jdbc:postgresql://localhost:5432/postgres'
      CAMPUSCORE_DEMO_TEAM_PG_USER: 'postgres'
      CAMPUSCORE_DEMO_TEAM_PG_PASSWORD: 'ci-postgres-it-ephemeral-01'
      CAMPUSCORE_SPRING_FOCUS_PG_ENABLED: 'true'
      CAMPUSCORE_SPRING_FOCUS_PG_ADMIN_URL: 'jdbc:postgresql://localhost:5432/postgres'
      CAMPUSCORE_SPRING_FOCUS_PG_USER: 'postgres'
      CAMPUSCORE_SPRING_FOCUS_PG_PASSWORD: 'ci-postgres-it-ephemeral-01'
    services:
      postgres:
        # Same major version as production (database/Dockerfile pins postgres:15).
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-it-ephemeral-01
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: java-services/pom.xml
      - name: Create the dedicated IT databases
        env:
          PGPASSWORD: ci-postgres-it-ephemeral-01
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE DATABASE campuscore_it_e2e;
          CREATE DATABASE campuscore_council_race_ci;
          CREATE DATABASE campuscore_it_suplist;
          CREATE DATABASE campuscore_it_upgrade;
          CREATE DATABASE campuscore_it_assistant_rls;
          CREATE DATABASE campuscore_it_assistant_migration;
          CREATE DATABASE campuscore_it_turn_ledger;
          CREATE DATABASE campuscore_it_report_regression;
          CREATE DATABASE policy_migration_test_notification_audit;
          CREATE DATABASE policy_migration_test_policy_local;
          CREATE DATABASE policy_migration_test_policy_previous_supabase;
          CREATE DATABASE policy_migration_test_policy_current_supabase;
          CREATE DATABASE policy_migration_test_policy_human;
          CREATE DATABASE policy_migration_test_cert_clean;
          CREATE DATABASE policy_migration_test_cert_local;
          CREATE DATABASE policy_migration_test_cert_drift_content;
          CREATE DATABASE policy_migration_test_cert_drift_revision_content;
          CREATE DATABASE policy_migration_test_cert_drift_document_metadata;
          CREATE DATABASE policy_migration_test_cert_drift_revision_metadata;
          CREATE DATABASE policy_migration_test_cert_drift_status;
          CREATE DATABASE policy_migration_test_cert_drift_draft;
          CREATE DATABASE policy_migration_test_cert_drift_published;
          CREATE DATABASE policy_migration_test_cert_concurrent;
          CREATE DATABASE policy_migration_test_cert_foreign;
          CREATE DATABASE policy_migration_test_cert_newer;
          CREATE DATABASE policy_migration_test_cert_base_drift;
          SQL
      - name: Provision the assistant RLS runtime role
        env:
          ASSISTANT_DB_PASSWORD: ci-assistant-rls-ephemeral-01
          SPRING_DATASOURCE_URL: 'jdbc:postgresql://localhost:5432/postgres'
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ci-postgres-it-ephemeral-01
        # Flyway V84 creates the runtime role NOLOGIN and never sets a password;
        # this idempotent script grants LOGIN + password exactly as Compose does.
        run: node scripts/provision-assistant-runtime.mjs
      - name: Run the Postgres-gated report concurrency test
        run: mvn -q -f java-services/pom.xml test -Dtest=ThesisReportConcurrencyTest
      - name: Run the Postgres integration suite
        env:
          # Scoped to this step on purpose: SqlKnowledgeReleasePromoterTest in
          # the surefire suite fails hard when ASSISTANT_POSTGRES_URL points
          # anywhere but the fixed e2e-stack URL. This step invokes failsafe
          # goals only, so surefire never runs with the variable visible.
          ASSISTANT_POSTGRES_URL: 'jdbc:postgresql://localhost:5432/campuscore_it_turn_ledger'
          ASSISTANT_POSTGRES_USER: 'postgres'
          ASSISTANT_POSTGRES_PASSWORD: 'ci-postgres-it-ephemeral-01'
        run: mvn -q -f java-services/pom.xml -P assistant-postgres-it test-compile failsafe:integration-test failsafe:verify
      - name: Fail if any Postgres IT silently skipped
        if: always()
        run: node scripts/check-postgres-its.mjs

  frontend:
    name: Next.js web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Test web
        working-directory: frontend
        run: npm test
      - name: Typecheck web
        working-directory: frontend
        run: npm run typecheck
      - name: Lint web
        working-directory: frontend
        run: npm run lint
      - name: Build web
        working-directory: frontend
        run: npm run build

  portal-viewport:
    name: Portal viewport shell
    runs-on: ubuntu-latest
    env:
      # Public demo values already printed on the login page; they render the
      # widest login state so the viewport check covers it.
      NEXT_PUBLIC_SHOW_DEMO_CREDENTIALS: 'true'
      NEXT_PUBLIC_DEMO_STUDENT_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start portal dev server
        working-directory: frontend
        run: |
          nohup npm run dev -- --port 4317 > /tmp/portal-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4317; then exit 0; fi
            sleep 2
          done
          echo 'portal dev server did not answer within 120s:'
          cat /tmp/portal-dev.log
          exit 1
      - name: Test portal shell at 1440, 768, and 390
        working-directory: frontend
        run: node --test tests/portal-shell.viewport.test.js

  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Test mobile
        working-directory: mobile
        run: npm test
      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

  e2e:
    name: Official Playwright e2e
    runs-on: ubuntu-latest
    env:
      # Keep the suite deterministic and credential-free; the assistant flows
      # under test must exercise the degraded lexical path, not a live model.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
      # Dev-only value for the disposable e2e stack: the assistant RLS runtime
      # role needs a password (>= 16 chars) provisioned before the API boots.
      # It never leaves this CI job and is not a secret.
      ASSISTANT_DB_PASSWORD: 'dev-ci-password-16chars-min'
      E2E_PLAYWRIGHT_PROJECT: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run official e2e suite on a disposable stack
        run: node scripts/run-course-e2e.mjs
      - name: Upload Playwright failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/playwright/
          retention-days: 7

  compose:
    name: PostgreSQL and Compose runtime
    runs-on: ubuntu-latest
    env:
      # Keep the course stack deterministic and credential-free.
      DEEPSEEK_ENABLED: 'false'
      DEEPSEEK_API_KEY: ''
      # Dev-only value for the fresh Compose volume: the assistant RLS runtime
      # role needs a password (>= 16 chars) before the stack can boot. It is
      # committed on purpose (CI-only, not a secret) and never used elsewhere.
      ASSISTANT_DB_PASSWORD: 'dev-ci-password-16chars-min'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the immutable-migration guard can diff against
          # origin/main (shallow clones make the merge-base diff empty).
          fetch-depth: 0
      - name: Flyway migrations are immutable once merged
        shell: bash
        run: |
          edited="$(git diff --name-only origin/main...HEAD -- 'java-services/**/db/migration/*.sql' 'java-services/**/db/migration-h2/*.sql')"
          if [ -n "$edited" ]; then
            while IFS= read -r f; do
              if git cat-file -e "origin/main:$f" 2>/dev/null; then
                echo "IMMUTABLE migration edited: $f"
                echo "Corrective changes are new forward migrations (V<n+1>); see db/migration/README.md."
                exit 1
              fi
            done <<< "$edited"
          fi
      - name: Migration filenames and versions are well-formed
        run: node scripts/check-migrations.mjs
      - name: Validate Compose
        run: docker compose config
      - name: Secret hygiene
        shell: bash
        run: |
          if git grep -nE 'sk-[A-Za-z0-9]{20,}' -- . ':!plans' ':!scripts/run-course-e2e.mjs'; then
            echo 'A provider-looking secret is tracked; refusing CI.'
            exit 1
          fi
          node scripts/check-assistant-secrets.mjs
          node scripts/check-doc-hygiene.mjs
      - name: Supabase content tooling tests
        run: node --test scripts/supabase/assistant-knowledge.test.mjs
      - name: Assistant RLS provisioning script tests
        run: node --test scripts/provision-assistant-runtime.test.mjs
      - name: Postgres IT skip-check script tests
        run: node --test scripts/check-postgres-its.test.mjs
      - name: Build and start fresh course stack
        run: docker compose up -d --build --wait
      - name: Verify database image boundary
        run: docker image inspect student-management-ute-database:local --format '{{.Config.Labels}}' | grep -q 'Flyway'
      - name: Verify Flyway, health, OpenAPI, login and RAG
        shell: bash
        run: |
          version="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc 'SELECT version FROM thesis.flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1')"
          # The schema boundary must equal the newest migration checked in, so a
          # migration that fails to apply (or a forgotten one) fails CI loudly.
          expected="$(ls java-services/restful-api/src/main/resources/db/migration | sed -E 's/^V([0-9]+)__[^.]*\.sql/\1/p' | sort -n | tail -1)"
          test "$version" = "$expected"
          curl --fail --silent --show-error http://127.0.0.1:4010/api/v1/health/liveness
          curl --fail --silent --show-error -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness
          curl --fail --silent --show-error http://127.0.0.1:4010/v3/api-docs > openapi.json
          python3 -c 'import json; paths=json.load(open("openapi.json", encoding="utf-8"))["paths"]; required={"/api/v1/auth/login", "/api/v1/students", "/api/v1/lecturers", "/api/v1/sections", "/api/v1/enrollments", "/api/v1/enrollments/enroll", "/api/v1/me/enrollments", "/api/v1/registration/rounds", "/api/v1/me/registration/eligibility", "/api/v1/sections/{sectionId}/grades", "/api/v1/announcements", "/api/v1/notifications", "/api/v1/assistant/chat", "/api/v1/assistant/chat/stream", "/api/v1/assistant/conversations", "/api/v1/thesis/assistant/chat", "/api/v1/thesis/assistant/chat/stream", "/api/v1/thesis/assistant/conversations", "/api/v1/admin/assistant/knowledge", "/api/v1/admin/thesis/assistant/knowledge", "/api/v1/thesis/groups/{id}/report/file", "/api/v1/health/readiness"}; assert not required.difference(paths), sorted(required.difference(paths)); assert "/api/v1/auth/register" not in paths, "public self-registration must stay removed"'
          # V48 locks the whole .demo population; V82 then activates exactly the
          # runbook-documented set and DemoAccountGate (gate enabled in this
          # stack) keeps it ACTIVE. Prove the Four-Eyes second approver can
          # sign in with the single published demo password:
          approver_status="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc "SELECT \"status\" FROM campuscore_auth.\"User\" WHERE \"email\" = 'admin002@campuscore.demo'")"
          test "$approver_status" = "ACTIVE"
          demo_login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"admin002@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          DEMO_LOGIN="$demo_login" python3 -c 'import json, os; assert json.loads(os.environ["DEMO_LOGIN"])["accessToken"]'
          dean_login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"truongkhoa@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          DEAN_LOGIN="$dean_login" python3 -c 'import json, os; body=json.loads(os.environ["DEAN_LOGIN"]); assert body["accessToken"]; assert "TRUONG_KHOA" in body["user"]["roles"] and "LECTURER" in body["user"]["roles"]'
          tbm_login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"truongbomon@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          TBM_LOGIN="$tbm_login" python3 -c 'import json, os; body=json.loads(os.environ["TBM_LOGIN"]); assert body["accessToken"]; assert "TRUONG_BO_MON" in body["user"]["roles"] and "LECTURER" in body["user"]["roles"]'
          admin_dean_roles="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc "SELECT COUNT(*) FROM campuscore_auth.\"UserRole\" ur JOIN campuscore_auth.\"Role\" r ON r.\"id\" = ur.\"roleId\" WHERE ur.\"userId\" = 'admin-user' AND r.\"name\" = 'TRUONG_KHOA'")"
          test "$admin_dean_roles" = "0"
          # V82 is exact-address, not a pattern unlock: a seeded persona outside
          # the runbook set stays LOCKED even with the gate enabled.
          persona_status="$(docker compose exec -T postgres psql -U campuscore -d campuscore_restful -Atc "SELECT \"status\" FROM campuscore_auth.\"User\" WHERE \"email\" = 'an.hnt@campuscore.demo'")"
          test "$persona_status" = "LOCKED"
          persona_login_code="$(curl --max-time 8 --silent --output /dev/null --write-out '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"an.hnt@campuscore.demo","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          test "$persona_login_code" = "401"
          # V50 activates showcase demo student, lecturer, and admin; student login succeeds directly:
          login="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -d '{"email":"student@campuscore.edu","password":"password123"}' http://127.0.0.1:4010/api/v1/auth/login)"
          token="$(LOGIN="$login" python3 -c 'import json, os; print(json.loads(os.environ["LOGIN"])["accessToken"])')"
          docker compose exec -T postgres psql -U campuscore -d campuscore_restful -v ON_ERROR_STOP=1 -c "UPDATE academic.\"RegistrationRound\" SET \"windowStart\" = CURRENT_TIMESTAMP - INTERVAL '1 day', \"windowEnd\" = CURRENT_TIMESTAMP + INTERVAL '1 day' WHERE \"id\" = 'round-registration-demo'"
          # Use an unoccupied generated section so the replay probe tests idempotency,
          # rather than colliding with the demo student's seeded timetable.
          first_enrollment="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -H 'Idempotency-Key: ci-postgres-replay-0001' -d '{"sectionId":"section-auto-019"}' http://127.0.0.1:4010/api/v1/me/enrollments)"
          second_enrollment="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -H 'Idempotency-Key: ci-postgres-replay-0001' -d '{"sectionId":"section-auto-019"}' http://127.0.0.1:4010/api/v1/me/enrollments)"
          FIRST_ENROLLMENT="$first_enrollment" SECOND_ENROLLMENT="$second_enrollment" python3 -c 'import json, os; first=json.loads(os.environ["FIRST_ENROLLMENT"]); second=json.loads(os.environ["SECOND_ENROLLMENT"]); assert first["status"] == "ENROLLED", first; assert second["id"] == first["id"], (first, second); assert second["status"] == "ENROLLED", second'
          assistant="$(curl --fail --silent --show-error -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000001"}' http://127.0.0.1:4010/api/v1/assistant/chat)"
          # PROVIDER_DISABLED is the degraded grounded path; ANSWERED is the
          # curated lexical fast path — both must still carry live citations.
          ASSISTANT="$assistant" python3 -c 'import json, os; data=json.loads(os.environ["ASSISTANT"]); assert data["reasonCode"] in ("PROVIDER_DISABLED", "ANSWERED"), data; assert data["reasonCode"] == "ANSWERED" or data["degraded"] is True, data; assert len(data["citations"]) > 0, data'
          rag_rejection="$(docker compose exec -T rag-service wget --server-response --tries=1 --header='Content-Type: application/json' --header='X-Rag-Service-Token: wrong-token' --header='X-Assistant-Owner: ci-rag-probe' --post-data='{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000003"}' -O /dev/null http://localhost:4011/internal/rag/assistant/chat 2>&1 || true)"
          printf '%s\n' "$rag_rejection" | grep -Eq 'HTTP/[0-9.]+ 403'
          rag_internal="$(docker compose exec -T rag-service wget --no-verbose --tries=1 --header='Content-Type: application/json' --header='X-Rag-Service-Token: dev-rag-service-token-rotate-before-exposing' --header='X-Assistant-Owner: ci-rag-probe' --post-data='{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000003"}' -O- http://localhost:4011/internal/rag/assistant/chat)"
          RAG_INTERNAL="$rag_internal" python3 -c 'import json, os; data=json.loads(os.environ["RAG_INTERNAL"]); assert data["reasonCode"] in ("PROVIDER_DISABLED", "ANSWERED"), data; assert data["reasonCode"] == "ANSWERED" or data["degraded"] is True, data; assert len(data["citations"]) > 0, data'
          docker compose stop postgres
          # With the database stopped, Hikari must evict its dead pooled
          # connections (validation timeout each) before the probe can answer;
          # allow up to 30s for the expected 503 instead of the 8s that raced
          # connection eviction on slower runners.
          readiness_code="$(curl --max-time 30 --silent --output /dev/null --write-out '%{http_code}' -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness)"
          test "$readiness_code" = "503"
          # Authenticated requests fail closed while the account store is down: the
          # session cannot be re-verified, so even the assistant answers 503.
          outage_body="$(mktemp)"
          outage_code="$(curl --max-time 30 --silent --output "$outage_body" --write-out '%{http_code}' -H 'Content-Type: application/json' -H "Authorization: Bearer $token" -d '{"message":"Điều kiện đăng ký đề tài là gì?","locale":"vi","clientRequestId":"00000000-0000-0000-0000-000000000002"}' http://127.0.0.1:4010/api/v1/assistant/chat)"
          test "$outage_code" = "503"
          grep -q DATABASE_UNAVAILABLE "$outage_body"
          docker compose start postgres
          docker compose up -d --wait
          curl --fail --silent --show-error -H 'X-Health-Key: local-course-health-key' http://127.0.0.1:4010/api/v1/health/readiness
      - name: Show runtime logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop course stack
        if: always()
        run: docker compose down
