  <rect x="96" y="178" width="360" height="78" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="114" y="196" width="38" height="26" rx="5" fill="#111827"/><circle cx="124" cy="209" r="3" fill="#ef4444"/><circle cx="133" cy="209" r="3" fill="#f59e0b"/><circle cx="142" cy="209" r="3" fill="#10b981"/>
  <text x="174" y="212" fill="#111827" font-size="17" font-weight="600">Next.js web portal</text>
  <text x="174" y="235" fill="#6b7280" font-size="12">Cookie auth + CSRF · student / lecturer / admin</text>
  <rect x="560" y="178" width="360" height="78" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="594" cy="211" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="594" y="216" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">M</text>
  <text x="630" y="212" fill="#111827" font-size="17" font-weight="600">Expo mobile app</text>
  <text x="630" y="235" fill="#6b7280" font-size="12">Bearer access + refresh tokens</text>
  <rect x="1024" y="178" width="360" height="78" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="1048" y="212" fill="#111827" font-size="17" font-weight="600">OpenAPI contract</text>
  <text x="1048" y="235" fill="#6b7280" font-size="12">Shared /api/v1 · /v3/api-docs · browser + mobile</text>

  <rect x="48" y="316" width="1504" height="176" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="72" y="345" fill="#475569" font-size="12" font-weight="700" letter-spacing="2">EDGE + PUBLIC API</text>
  <rect x="96" y="370" width="300" height="96" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="246" y="407" text-anchor="middle" fill="#111827" font-size="18" font-weight="700">Caddy</text>
  <text x="246" y="430" text-anchor="middle" fill="#6b7280" font-size="12">Production edge · TLS · 80 / 443</text>
  <text x="246" y="449" text-anchor="middle" fill="#6b7280" font-size="11">Prepared bundle · no cutover claim</text>
  <rect x="472" y="354" width="520" height="120" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2"/>
  <rect x="480" y="362" width="504" height="104" rx="10" fill="none" stroke="#a7f3d0" stroke-width="1"/>
  <text x="732" y="395" text-anchor="middle" fill="#111827" font-size="19" font-weight="700">Spring Boot REST API</text>
  <text x="732" y="419" text-anchor="middle" fill="#6b7280" font-size="12">Public /api/v1 · auth · catalog · enrollment · grades · schedule</text>
  <text x="732" y="441" text-anchor="middle" fill="#6b7280" font-size="12">announcements · notifications · thesis · assistant proxy</text>

  <rect x="48" y="528" width="1504" height="190" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="72" y="557" fill="#059669" font-size="12" font-weight="700" letter-spacing="2">PRIVATE APPLICATION SERVICES</text>
  <rect x="1008" y="570" width="380" height="120" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="1198" y="604" text-anchor="middle" fill="#111827" font-size="18" font-weight="700">rag-service sidecar</text>
  <text x="1198" y="627" text-anchor="middle" fill="#6b7280" font-size="12">Same Java artifact · profile :4011</text>
  <text x="1198" y="648" text-anchor="middle" fill="#6b7280" font-size="12">lexical RAG · citations · no-match fallback</text>
  <text x="1198" y="669" text-anchor="middle" fill="#6b7280" font-size="12">deterministic hard-query gate</text>

  <rect x="48" y="754" width="1504" height="300" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="72" y="783" fill="#6b7280" font-size="12" font-weight="700" letter-spacing="2">DATA + AUTHORITIES + LOCAL OPERATIONS</text>
  <rect x="96" y="824" width="390" height="126" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="291" y="852" text-anchor="middle" fill="#1e3a5f" font-size="17" font-weight="700">PostgreSQL</text>
  <ellipse cx="291" cy="873" rx="126" ry="14" fill="#dbeafe" stroke="#336791" stroke-width="1.5"/>
  <rect x="165" y="873" width="252" height="38" fill="#eff6ff"/>
  <line x1="165" y1="873" x2="165" y2="911" stroke="#336791" stroke-width="1.5"/><line x1="417" y1="873" x2="417" y2="911" stroke="#336791" stroke-width="1.5"/>
  <ellipse cx="291" cy="911" rx="126" ry="14" fill="#dbeafe" stroke="#336791" stroke-width="1.5"/>
  <text x="291" y="897" text-anchor="middle" fill="#6b7280" font-size="11">academic transactions + active RAG snapshot</text>
  <text x="291" y="936" text-anchor="middle" fill="#6b7280" font-size="11">Flyway owner: rag-service</text>

  <rect x="570" y="824" width="390" height="126" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <circle cx="610" cy="866" r="20" fill="#0ea5e9"/><text x="610" y="871" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">SB</text>
  <text x="642" y="861" fill="#111827" font-size="17" font-weight="700">Supabase assistant schema</text>
  <text x="642" y="884" fill="#6b7280" font-size="12">Production authoring + published releases</text>
  <text x="642" y="905" fill="#6b7280" font-size="12">server-only sync · hash / count / privacy checks</text>
  <text x="642" y="926" fill="#6b7280" font-size="11">atomic promotion into PostgreSQL runtime snapshot</text>

  <rect x="1040" y="824" width="390" height="126" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1235" y="857" text-anchor="middle" fill="#111827" font-size="17" font-weight="700">DeepSeek V4 Flash</text>
  <text x="1235" y="880" text-anchor="middle" fill="#6b7280" font-size="12">Optional backend provider · server key only</text>
  <text x="1235" y="902" text-anchor="middle" fill="#6b7280" font-size="12">hard queries · bounded retrieved context</text>
  <text x="1235" y="924" text-anchor="middle" fill="#6b7280" font-size="11">never called for no-match or direct fact lookup</text>

  <rect x="96" y="978" width="300" height="56" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="246" y="1003" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">Mailpit</text>
  <text x="246" y="1022" text-anchor="middle" fill="#6b7280" font-size="11">Optional local SMTP preview · profiled out of prod</text>

