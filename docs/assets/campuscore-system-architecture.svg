  <rect width="1600" height="1200" fill="#ffffff"/>
  <text x="64" y="58" fill="#111827" font-size="30" font-weight="700">CampusCore system architecture</text>
  <text x="64" y="88" fill="#6b7280" font-size="15">One public Java API, governed RAG releases, and explicit local / production boundaries</text>
  <rect x="48" y="120" width="1504" height="160" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="7,4"/>
