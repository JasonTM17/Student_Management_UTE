  <rect x="1060" y="449" width="220" height="22" rx="5" fill="#ffffff" opacity="0.96"/><text x="1170" y="465" text-anchor="middle" fill="#ea580c" font-size="11">answer + citations + reasonCode</text>

  <path d="M 612 474 L 612 724 L 291 724 L 291 824" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="382" y="704" width="138" height="22" rx="5" fill="#ffffff" opacity="0.96"/><text x="451" y="720" text-anchor="middle" fill="#059669" font-size="11">business SQL · records</text>
  <path d="M 1090 690 L 1090 732 L 430 732 L 430 824" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="704" y="706" width="180" height="22" rx="5" fill="#ffffff" opacity="0.96"/><text x="794" y="722" text-anchor="middle" fill="#059669" font-size="11">snapshot promotion / Flyway</text>
