  <path d="M 814 474 L 814 706 L 80 706 L 80 1000 L 96 1000" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <rect x="548" y="686" width="104" height="22" rx="5" fill="#ffffff" opacity="0.96"/><text x="600" y="702" text-anchor="middle" fill="#6b7280" font-size="11">SMTP local opt-in</text>

