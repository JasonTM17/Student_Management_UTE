    <line x1="0" y1="22" x2="34" y2="22" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="44" y="26" fill="#6b7280" font-size="12">client / edge request</text>
    <line x1="190" y1="22" x2="224" y2="22" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/><text x="234" y="26" fill="#6b7280" font-size="12">data / runtime snapshot</text>
    <line x1="420" y1="22" x2="454" y2="22" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="464" y="26" fill="#6b7280" font-size="12">private service contract</text>
