# No-build overlay for the published GHCR images.
# Use with:
#   docker compose -f docker-compose.yml -f docker-compose.rag.override.yml up -d --no-build
# This swaps the local build tags for the repo-published artifacts while keeping
# the base full-stack topology unchanged.

services:
  rag-service:
    image: ghcr.io/jasontm17/student-management-ute-rag-service:latest

  restful-api:
    image: ghcr.io/jasontm17/student-management-ute-restful-api:latest

  web:
    image: ghcr.io/jasontm17/student-management-ute-frontend:latest
