# No-build overlay for the published GHCR images.
# Use with:
#   CAMPUSCORE_IMAGE_TAG=<short-sha> docker compose -f docker-compose.yml -f docker-compose.rag.override.yml up -d --no-build
# Omit CAMPUSCORE_IMAGE_TAG only when deliberately following the moving latest tag.
# This swaps the local build tags for the repo-published artifacts while keeping
# the base full-stack topology unchanged.

services:
  postgres:
    image: ghcr.io/jasontm17/student-management-ute-database:${CAMPUSCORE_IMAGE_TAG:-latest}

  rag-service:
    image: ghcr.io/jasontm17/student-management-ute-rag-service:${CAMPUSCORE_IMAGE_TAG:-latest}

  restful-api:
    image: ghcr.io/jasontm17/student-management-ute-restful-api:${CAMPUSCORE_IMAGE_TAG:-latest}

  web:
    image: ghcr.io/jasontm17/student-management-ute-frontend:${CAMPUSCORE_IMAGE_TAG:-latest}
