spring:
  application:
    name: campuscore-restful-api
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
  main:
    banner-mode: off
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    locale: vi
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${SERVER_PORT:4010}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET:}}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}
  refresh-token-cookie: ${REFRESH_TOKEN_COOKIE:cc_refresh_token}
  csrf-cookie: ${CSRF_COOKIE:cc_csrf}
  csrf-header: ${CSRF_HEADER:X-CSRF-Token}
  cookie-secure: ${COOKIE_SECURE:false}

mail:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:no-reply@campuscore.local}

auth:
  frontend-base-url: ${AUTH_FRONTEND_BASE_URL:http://localhost:3000}
  lifecycle:
    verification-ttl-seconds: ${AUTH_VERIFICATION_TTL_SECONDS:86400}
    password-reset-ttl-seconds: ${AUTH_PASSWORD_RESET_TTL_SECONDS:1800}
    resend-cooldown-seconds: ${AUTH_RESEND_COOLDOWN_SECONDS:60}
    max-challenge-attempts: ${AUTH_MAX_CHALLENGE_ATTEMPTS:5}
    max-requests-per-day: ${AUTH_MAX_REQUESTS_PER_DAY:5}

health:
  readiness-key: ${HEALTH_READINESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  timeout-ms: ${DEEPSEEK_TIMEOUT_MS:8000}
  max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:800}
  max-response-bytes: ${DEEPSEEK_MAX_RESPONSE_BYTES:512000}
  max-frame-bytes: ${DEEPSEEK_MAX_FRAME_BYTES:64000}
  max-concurrent: ${DEEPSEEK_MAX_CONCURRENT:4}

assistant:
  max-context-chars: ${ASSISTANT_MAX_CONTEXT_CHARS:6000}
  max-message-chars: ${ASSISTANT_MAX_MESSAGE_CHARS:2000}
  user-daily-quota: ${ASSISTANT_USER_DAILY_QUOTA:20}
  global-daily-quota: ${ASSISTANT_GLOBAL_DAILY_QUOTA:200}
  retention-days: ${ASSISTANT_RETENTION_DAYS:90}
  recovery-delay-ms: ${ASSISTANT_RECOVERY_DELAY_MS:30000}
  recovery-initial-delay-ms: ${ASSISTANT_RECOVERY_INITIAL_DELAY_MS:30000}

---
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=thesis}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
  jpa:
    hibernate:
      # Flyway owns the schema; validation catches entity/schema drift at startup.
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        default_schema: thesis
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: thesis
    schemas: thesis
    locations: classpath:db/migration
