spring:
  application:
    name: campuscore-restful-api
  main:
    banner-mode: off
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${SERVER_PORT:4010}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET:}}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}
  refresh-token-cookie: ${REFRESH_TOKEN_COOKIE:cc_refresh_token}
  csrf-cookie: ${CSRF_COOKIE:cc_csrf}
  csrf-header: ${CSRF_HEADER:X-CSRF-Token}
  cookie-secure: ${COOKIE_SECURE:false}

health:
  readiness-key: ${HEALTH_READINESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=thesis}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must not reject focused fixture tests
      # that intentionally disable migrations and create only their own tables.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: thesis
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: thesis
    schemas: thesis
    locations: classpath:db/migration
