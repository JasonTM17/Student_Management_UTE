spring:
  application:
    name: campuscore-restful-api
  main:
    banner-mode: off
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${SERVER_PORT:4010}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET:}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}
  refresh-token-cookie: ${REFRESH_TOKEN_COOKIE:cc_refresh_token}
  csrf-cookie: ${CSRF_COOKIE:cc_csrf}
  csrf-header: ${CSRF_HEADER:X-CSRF-Token}

health:
  readiness-key: ${HEALTH_READINESS_KEY:}

migration:
  thesis-read:
    enabled: ${THESIS_READ_ENABLED:false}
  notifications-read:
    enabled: ${NOTIFICATIONS_READ_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

---
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=thesis}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: thesis
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: thesis
    schemas: thesis
    locations: classpath:db/migration
