spring:
  application:
    name: campuscore-restful-api
  main:
    banner-mode: off
  mvc:
    throw-exception-if-no-handler-found: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

server:
  port: ${SERVER_PORT:4010}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET:}
    refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET:}}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}
  refresh-token-cookie: ${REFRESH_TOKEN_COOKIE:cc_refresh_token}
  csrf-cookie: ${CSRF_COOKIE:cc_csrf}
  csrf-header: ${CSRF_HEADER:X-CSRF-Token}
  cookie-secure: ${COOKIE_SECURE:false}

health:
  readiness-key: ${HEALTH_READINESS_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

deepseek:
  enabled: ${DEEPSEEK_ENABLED:false}
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
  timeout-ms: ${DEEPSEEK_TIMEOUT_MS:8000}
  max-output-tokens: ${DEEPSEEK_MAX_OUTPUT_TOKENS:800}
  max-response-bytes: ${DEEPSEEK_MAX_RESPONSE_BYTES:512000}
  max-frame-bytes: ${DEEPSEEK_MAX_FRAME_BYTES:64000}
  max-concurrent: ${DEEPSEEK_MAX_CONCURRENT:4}

assistant:
  knowledge:
    # sql keeps the course/local authoring compatibility path; production REST
    # uses remote and private rag-service uses supabase.
    authority-mode: ${ASSISTANT_KNOWLEDGE_AUTHORITY_MODE:sql}
  max-context-chars: ${ASSISTANT_MAX_CONTEXT_CHARS:6000}
  max-message-chars: ${ASSISTANT_MAX_MESSAGE_CHARS:2000}
  user-daily-quota: ${ASSISTANT_USER_DAILY_QUOTA:20}
  global-daily-quota: ${ASSISTANT_GLOBAL_DAILY_QUOTA:200}
  retention-days: ${ASSISTANT_RETENTION_DAYS:90}
  recovery-delay-ms: ${ASSISTANT_RECOVERY_DELAY_MS:30000}
  recovery-initial-delay-ms: ${ASSISTANT_RECOVERY_INITIAL_DELAY_MS:30000}
  rag:
    base-url: ${ASSISTANT_RAG_BASE_URL:}
    service-token: ${ASSISTANT_RAG_SERVICE_TOKEN:}
    service-mode: ${ASSISTANT_RAG_SERVICE_MODE:false}
    connect-timeout-ms: ${ASSISTANT_RAG_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${ASSISTANT_RAG_READ_TIMEOUT_MS:30000}
  supabase:
    enabled: ${ASSISTANT_SUPABASE_ENABLED:false}
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    schema: ${SUPABASE_SCHEMA:assistant}
    release-table: ${SUPABASE_RELEASE_TABLE:knowledge_release}
    document-table: ${SUPABASE_DOCUMENT_TABLE:knowledge_release_document}
    reconcile-delay-ms: ${ASSISTANT_SUPABASE_RECONCILE_DELAY_MS:900000}
    reconcile-initial-delay-ms: ${ASSISTANT_SUPABASE_RECONCILE_INITIAL_DELAY_MS:120000}
    connect-timeout-ms: ${ASSISTANT_SUPABASE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ASSISTANT_SUPABASE_READ_TIMEOUT_MS:30000}

---
spring:
  config:
    activate:
      on-profile: persistence
  autoconfigure:
    exclude: []
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=thesis}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate must not reject focused fixture tests
      # that intentionally disable migrations and create only their own tables.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: thesis
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: thesis
    schemas: thesis,academic
    locations: classpath:db/migration
