security:
  jwt:
    secret: test-only-restful-api-secret-with-at-least-32-characters
    refresh-secret: test-only-refresh-secret-with-at-least-32-characters

health:
  readiness-key: test-health-key

deepseek:
  enabled: false

assistant:
  rls:
    # H2 has no PostgreSQL RLS engine. This fallback is active only under the
    # explicit test profile; production startup rejects test mode.
    test-mode: true
  # H2-focused legacy fixtures predate the V16 runtime projection. Production
  # keeps this false so a missing projection is a hard startup/runtime defect.
  legacy-retrieval-fallback: true
  # The lexical fast path stays OFF in the test profile so every existing
  # Spring test keeps exercising the unchanged RAG-first chain. The fast-path
  # behaviour is covered by ThesisAssistantLexicalFastPathTest (unit) and
  # ThesisAssistantLexicalFastPathWebTest, which flips it back on explicitly.
  lexical-fast-path: false
  retention:
    enabled: false

spring:
  test:
    mockmvc:
      # The default printing handler iterates live response headers while the
      # SSE producer thread is still writing them — a real
      # ConcurrentModificationException race in async stream tests.
      print: NONE
  datasource:
    url: jdbc:h2:mem:restful_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2

app:
  rate-limit:
    enabled: false
