security:
  jwt:
    secret: test-only-restful-api-secret-with-at-least-32-characters
    refresh-secret: test-only-refresh-secret-with-at-least-32-characters

health:
  readiness-key: test-health-key

assistant:
  # Focused H2 fixtures do not create the PostgreSQL assistant schema. The
  # repository recovery tests invoke the worker explicitly when needed.
  retention:
    enabled: false

spring:
  datasource:
    url: jdbc:h2:mem:restful_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
  jpa:
    hibernate:
      # Focused JDBC fixtures intentionally create only their owned tables.
      ddl-auto: none
