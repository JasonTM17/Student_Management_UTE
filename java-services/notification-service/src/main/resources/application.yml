server:
  port: 4011
  shutdown: graceful

spring:
  application:
    name: campuscore-notification-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/campuscore}
    username: ${DB_USER:campuscore}
    password: ${DB_PASSWORD:campuscore}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: notifications
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: notifications
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:4000}
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:4000/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
