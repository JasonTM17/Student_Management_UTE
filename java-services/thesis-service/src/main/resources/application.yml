spring:
  application:
    name: campuscore-thesis-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=thesis}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: thesis
        jdbc:
          time_zone: UTC
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    create-schemas: true
    default-schema: thesis
    schemas: thesis
    locations: classpath:db/migration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${SERVER_PORT:4010}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt:
    secret: ${JWT_SECRET:}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}
  csrf-cookie: ${CSRF_COOKIE:cc_csrf}
  csrf-header: ${CSRF_HEADER:X-CSRF-Token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${spring.application.name}

springdoc:
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs

assistant:
  enabled: ${ASSISTANT_ENABLED:false}
  base-url: ${DEEPSEEK_BASE_URL:}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:}
  max-requests-per-minute: ${ASSISTANT_MAX_REQUESTS_PER_MINUTE:20}
  max-message-length: ${ASSISTANT_MAX_MESSAGE_LENGTH:2000}
