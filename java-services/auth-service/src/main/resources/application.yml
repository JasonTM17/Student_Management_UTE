spring:
  application:
    name: campuscore-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campuscore?currentSchema=auth}
    username: ${SPRING_DATASOURCE_USERNAME:campuscore}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:4007}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

security:
  jwt-secret: ${JWT_SECRET:}
  access-token-cookie: ${ACCESS_TOKEN_COOKIE:cc_access_token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
