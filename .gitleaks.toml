title = "Student Management Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Ignore AgentKit skill reference documentation examples"
paths = [
  '''^\.agents/skills/''',
  '''^\.claude/skills/''',
  '''^\.codex/skills/''',
  '''^\.cursor/skills/''',
  '''^engineer/skills/''',
]

[[allowlists]]
description = "ops/thesis-demo-data/expected-image.sql is a generated artifact: it embeds md5 content hashes of demo marker rows, not credentials"
paths = [
  '''^ops/thesis-demo-data/expected-image\.sql$''',
]
