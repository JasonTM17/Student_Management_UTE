apiVersion: apps/v1
kind: Deployment
metadata:
  name: thesis-service
  labels:
    app.kubernetes.io/name: thesis-service
    app.kubernetes.io/component: migration-pilot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: thesis-service
  template:
    metadata:
      labels:
        app: thesis-service
        app.kubernetes.io/name: thesis-service
        app.kubernetes.io/component: migration-pilot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "4010"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - until pg_isready -h postgres -p 5432 -U campuscore -d campuscore; do sleep 2; done
        - name: wait-for-redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -lc
            - until redis-cli -h redis -p 6379 ping | grep -q PONG; do sleep 2; done
      containers:
        - name: thesis-service
          image: campuscore-thesis-service:pilot-local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4010
              name: http
          envFrom:
            - configMapRef:
                name: campuscore-shared-env
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/campuscore?currentSchema=thesis
            - name: SPRING_DATASOURCE_USERNAME
              value: campuscore
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: campuscore-secrets
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: campuscore-secrets
                  key: JWT_SECRET
            - name: HEALTH_READINESS_KEY
              valueFrom:
                secretKeyRef:
                  name: campuscore-secrets
                  key: HEALTH_READINESS_KEY
            - name: REDIS_URL
              value: redis://redis:6379
            - name: SERVER_PORT
              value: "4010"
            - name: FLYWAY_ENABLED
              # Pilot-only schema bootstrap. Shared environments must replace
              # this with an operator-managed migration Job before promotion.
              value: "true"
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: health,info,prometheus
            - name: ASSISTANT_ENABLED
              value: "false"
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - 'curl --fail --silent --show-error --header "X-Health-Key: $HEALTH_READINESS_KEY" http://127.0.0.1:4010/api/v1/health/readiness >/dev/null'
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command:
                - sh
                - -lc
                - 'curl --fail --silent --show-error --header "X-Health-Key: $HEALTH_READINESS_KEY" http://127.0.0.1:4010/api/v1/health/readiness >/dev/null'
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 4010
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: thesis-service
  labels:
    app.kubernetes.io/name: thesis-service
    app.kubernetes.io/component: migration-pilot
spec:
  selector:
    app: thesis-service
  ports:
    - name: http
      port: 4010
      targetPort: 4010
