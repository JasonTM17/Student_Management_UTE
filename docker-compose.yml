    container_name: campuscore-web
    environment:
      NODE_ENV: production
    depends_on:
      core-api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      academic-service:
        condition: service_healthy
      engagement-service:
