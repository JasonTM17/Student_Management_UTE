name: campuscore-course

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuscore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campuscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuscore_password}
      POSTGRES_DB: ${POSTGRES_DB:-campuscore_restful}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - campuscore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-campuscore} -d ${POSTGRES_DB:-campuscore_restful}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  restful-api:
    build:
      context: ./java-services
      dockerfile: restful-api/Dockerfile
    image: campuscore-restful-api:local
    container_name: campuscore-restful-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-persistence}
      SERVER_PORT: 4010
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuscore_restful}?currentSchema=thesis
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campuscore}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-campuscore_password}
      HEALTH_READINESS_KEY: ${HEALTH_READINESS_KEY:-local-dev-readiness-key-12345}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-dev-internal-service-token-12345}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-rotate-before-shared-use}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-rotate-before-shared-use}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-604800}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      COURSE_API_ENABLED: ${COURSE_API_ENABLED:-true}
      THESIS_READ_ENABLED: ${THESIS_READ_ENABLED:-true}
      AUTH_LOGIN_ENABLED: ${AUTH_LOGIN_ENABLED:-true}
      NOTIFICATIONS_READ_ENABLED: ${NOTIFICATIONS_READ_ENABLED:-true}
      NOTIFICATIONS_WRITE_ENABLED: ${NOTIFICATIONS_WRITE_ENABLED:-true}
      ENGAGEMENT_READ_ENABLED: ${ENGAGEMENT_READ_ENABLED:-true}
      ENGAGEMENT_WRITE_ENABLED: ${ENGAGEMENT_WRITE_ENABLED:-true}
      ACADEMIC_READ_ENABLED: ${ACADEMIC_READ_ENABLED:-true}
      ACADEMIC_CONTEXT_ENABLED: ${ACADEMIC_CONTEXT_ENABLED:-false}
      ACADEMIC_ENROLLMENT_READ_ENABLED: ${ACADEMIC_ENROLLMENT_READ_ENABLED:-true}
      ACADEMIC_SCHEDULE_READ_ENABLED: ${ACADEMIC_SCHEDULE_READ_ENABLED:-true}
      ACADEMIC_WAITLIST_READ_ENABLED: ${ACADEMIC_WAITLIST_READ_ENABLED:-true}
      ACADEMIC_ATTENDANCE_READ_ENABLED: ${ACADEMIC_ATTENDANCE_READ_ENABLED:-false}
      ACADEMIC_SECTION_READ_ENABLED: ${ACADEMIC_SECTION_READ_ENABLED:-true}
      PEOPLE_READ_ENABLED: ${PEOPLE_READ_ENABLED:-true}
      FINANCE_READ_ENABLED: ${FINANCE_READ_ENABLED:-false}
      ANALYTICS_READ_ENABLED: ${ANALYTICS_READ_ENABLED:-false}
      THESIS_ASSISTANT_ENABLED: ${THESIS_ASSISTANT_ENABLED:-true}
    ports:
      - "127.0.0.1:4010:4010"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:4010/api/v1/health/liveness >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

volumes:
  campuscore_postgres_data:
