services:
  - type: web
    name: campuscore-backend
    runtime: docker
    dockerfilePath: ./java-services/restful-api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: persistence
      - key: FLYWAY_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xmx350m -Xss512k -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -XX:+ExitOnOutOfMemoryError"
      - key: SECURITY_JWT_REJECT_KNOWN_DEFAULTS
        value: "true"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DEEPSEEK_ENABLED
        value: "false"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
