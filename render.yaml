services:
  - type: web
    name: campuscore-backend
    runtime: docker
    dockerfilePath: ./java-services/restful-api/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health/liveness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: persistence
      - key: FLYWAY_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      # Render's proxy sets the real client IP in forwarded headers; trusting
      # them here keeps per-client limits accurate (anti-brute-force).
      - key: RATE_LIMIT_TRUST_PROXY_HEADERS
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:+UseSerialGC -Xmx300m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=36m -XX:+ExitOnOutOfMemoryError"
      - key: SECURITY_JWT_REJECT_KNOWN_DEFAULTS
        value: "true"
      # Unlocks /api/v1/health/readiness (the DB-aware probe). liveness stays
      # the Render healthCheckPath on purpose: coupling liveness to a remote
      # database would restart the service on every Supabase blip, while
      # readiness exists precisely to report that dependency.
      - key: HEALTH_READINESS_KEY
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The seeded showcase accounts carry passwords published in this repository's
      # history. This deployment is public, so the accounts stay DISABLED. Flip to
      # "true" only on a host you are willing to expose an administrator login on.
      - key: DEMO_ACCOUNTS_ENABLED
        value: "false"
      - key: DEEPSEEK_ENABLED
        value: "true"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_TIMEOUT_MS
        value: "15000"
      - key: DEEPSEEK_MAX_OUTPUT_TOKENS
        value: "1200"

