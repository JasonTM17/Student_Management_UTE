name: campuscore-production

# Production topology can run standalone or as the reviewed override of the
# course stack.  The !override tags are deliberate: when both files are passed
# to Compose they remove localhost ports, Mailpit, plaintext secrets and local
# volumes instead of silently merging them into the production graph.
services:
  postgres:
    image: ${CAMPUSCORE_IMAGE_REGISTRY:-docker.io/nguyenson1710}/campuscore-database:${CAMPUSCORE_IMAGE_TAG:-latest}
    environment: !override
      POSTGRES_USER: ${POSTGRES_USER:-campuscore}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-campuscore_restful}
    ports: !override []
    volumes: !override
      - campuscore_production_postgres_data:/var/lib/postgresql/data
      - ./ops/secrets/postgres_password:/run/secrets/postgres_password:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    logging: &production_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped

  rag-service:
    image: ${CAMPUSCORE_IMAGE_REGISTRY:-docker.io/nguyenson1710}/campuscore-rag-service:${CAMPUSCORE_IMAGE_TAG:-latest}
    environment: !override
      SPRING_PROFILES_ACTIVE: persistence
      SERVER_PORT: 4011
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuscore_restful}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campuscore}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      HEALTH_READINESS_KEY_FILE: /run/secrets/readiness_key
      ASSISTANT_RAG_SERVICE_TOKEN_FILE: /run/secrets/rag_service_token
      ASSISTANT_RAG_SERVICE_MODE: "true"
      ASSISTANT_KNOWLEDGE_AUTHORITY_MODE: "supabase"
      FLYWAY_ENABLED: "true"
      ASSISTANT_SUPABASE_ENABLED: ${ASSISTANT_SUPABASE_ENABLED:-true}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL for the production knowledge authority}
      SUPABASE_SERVICE_ROLE_KEY_FILE: /run/secrets/supabase_service_role_key
      SUPABASE_SCHEMA: ${SUPABASE_SCHEMA:-assistant}
      DEEPSEEK_ENABLED: ${DEEPSEEK_ENABLED:-false}
      DEEPSEEK_API_KEY_FILE: /run/secrets/deepseek_api_key
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_MS: ${DEEPSEEK_TIMEOUT_MS:-8000}
      DEEPSEEK_MAX_OUTPUT_TOKENS: ${DEEPSEEK_MAX_OUTPUT_TOKENS:-800}
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-2000}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-6000}
      ASSISTANT_USER_DAILY_QUOTA: ${ASSISTANT_USER_DAILY_QUOTA:-20}
      ASSISTANT_GLOBAL_DAILY_QUOTA: ${ASSISTANT_GLOBAL_DAILY_QUOTA:-200}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
    volumes: !override
      - ./ops/secrets/postgres_password:/run/secrets/postgres_password:ro
      - ./ops/secrets/jwt_secret:/run/secrets/jwt_secret:ro
      - ./ops/secrets/jwt_refresh_secret:/run/secrets/jwt_refresh_secret:ro
      - ./ops/secrets/readiness_key:/run/secrets/readiness_key:ro
      - ./ops/secrets/rag_service_token:/run/secrets/rag_service_token:ro
      - ./ops/secrets/deepseek_api_key:/run/secrets/deepseek_api_key:ro
      - ./ops/secrets/supabase_service_role_key:/run/secrets/supabase_service_role_key:ro
    networks: [app, data]
    depends_on: !override
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --header=\"X-Health-Key: $$(cat /run/secrets/readiness_key)\" -O- http://127.0.0.1:4011/api/v1/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    logging: *production_logging
    restart: unless-stopped

  restful-api:
    image: ${CAMPUSCORE_IMAGE_REGISTRY:-docker.io/nguyenson1710}/campuscore-restful-api:${CAMPUSCORE_IMAGE_TAG:-latest}
    environment: !override
      SPRING_PROFILES_ACTIVE: persistence
      SERVER_PORT: 4010
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-campuscore_restful}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-campuscore}
      SPRING_DATASOURCE_PASSWORD_FILE: /run/secrets/postgres_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      HEALTH_READINESS_KEY_FILE: /run/secrets/readiness_key
      ASSISTANT_RAG_BASE_URL: http://rag-service:4011/internal/rag/assistant
      ASSISTANT_RAG_SERVICE_TOKEN_FILE: /run/secrets/rag_service_token
      ASSISTANT_KNOWLEDGE_AUTHORITY_MODE: "remote"
      ASSISTANT_RETENTION_ENABLED: "true"
      COOKIE_SECURE: "true"
      # rag-service is the single Flyway owner for the shared runtime DB.
      FLYWAY_ENABLED: "false"
      MAIL_ENABLED: "false"
      DEEPSEEK_ENABLED: "false"
      ASSISTANT_MAX_MESSAGE_CHARS: ${ASSISTANT_MAX_MESSAGE_CHARS:-2000}
      ASSISTANT_MAX_CONTEXT_CHARS: ${ASSISTANT_MAX_CONTEXT_CHARS:-6000}
      ASSISTANT_USER_DAILY_QUOTA: ${ASSISTANT_USER_DAILY_QUOTA:-20}
      ASSISTANT_GLOBAL_DAILY_QUOTA: ${ASSISTANT_GLOBAL_DAILY_QUOTA:-200}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-90}
    volumes: !override
      - ./ops/secrets/postgres_password:/run/secrets/postgres_password:ro
      - ./ops/secrets/jwt_secret:/run/secrets/jwt_secret:ro
      - ./ops/secrets/jwt_refresh_secret:/run/secrets/jwt_refresh_secret:ro
      - ./ops/secrets/readiness_key:/run/secrets/readiness_key:ro
      - ./ops/secrets/rag_service_token:/run/secrets/rag_service_token:ro
    ports: !override []
    networks: [app, data]
    depends_on: !override
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --header=\"X-Health-Key: $$(cat /run/secrets/readiness_key)\" -O- http://127.0.0.1:4010/api/v1/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1.5G
    logging: *production_logging
    restart: unless-stopped

  web:
    image: ${CAMPUSCORE_IMAGE_REGISTRY:-docker.io/nguyenson1710}/campuscore-frontend:${CAMPUSCORE_IMAGE_TAG:-latest}
    environment: !override
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      JAVA_API_ORIGIN: http://restful-api:4010
      NEXT_PUBLIC_API_URL: /api/v1
    ports: !override []
    networks: [app]
    depends_on: !override
      restful-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O- http://127.0.0.1:3000/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *production_logging
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      CAMPUSCORE_DOMAIN: ${CAMPUSCORE_DOMAIN:?Set CAMPUSCORE_DOMAIN to the real DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate recovery}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - campuscore_caddy_data:/data
      - campuscore_caddy_config:/config
      - campuscore_caddy_logs:/var/log/caddy
    networks: [edge, app]
    depends_on:
      web:
        condition: service_healthy
      restful-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging: *production_logging
    restart: unless-stopped

  # The local course file includes Mailpit for development. It is explicitly
  # profiled out of this production graph, including when files are merged.
  mailpit:
    profiles: [local-only]

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true

volumes:
  campuscore_production_postgres_data:
  campuscore_caddy_data:
  campuscore_caddy_config:
  campuscore_caddy_logs:
